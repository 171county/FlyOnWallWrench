<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>FOTW&#178;</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <canvas id="bg"></canvas>
    <main class="shell">
      <div class="stage">
        <header class="brand">
          <div class="logo">&lt;/&gt;</div>
          <div>
            <div class="kicker">Fly On The Wall &middot; Squared</div>
            <h1 class="title">FOTW&#178;</h1>
          </div>
        </header>

        <div class="actions">
          <button id="ask-selection" class="action">
            <span class="ico">&#9101;</span>
            <span>Ask about <b>selected text</b></span>
            <span class="chev">&rsaquo;</span>
          </button>
          <button id="ask-page" class="action">
            <span class="ico">&#9678;</span>
            <span>Ask about <b>visible page</b></span>
            <span class="chev">&rsaquo;</span>
          </button>
          <button id="open-sidepanel" class="action ghost">
            <span class="ico">&#9636;</span>
            <span>Open <b>side panel</b></span>
            <span class="chev">&rsaquo;</span>
          </button>
        </div>

        <footer class="trust">
          <span class="dot"></span> Nothing is posted or submitted automatically.
        </footer>
      </div>
      <div id="toast" class="toast"></div>
    </main>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
