<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="bc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4cc2ff" stop-opacity="0.8"/><stop offset="100%" stop-color="#4cc2ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bs" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6f7bbf" stop-opacity="0.75"/><stop offset="100%" stop-color="#6f7bbf" stop-opacity="0"/></radialGradient>
    <radialGradient id="ba" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e0964a" stop-opacity="0.5"/><stop offset="100%" stop-color="#e0964a" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgn" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2ee06a" stop-opacity="0.28"/><stop offset="100%" stop-color="#2ee06a" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4cc2ff"/><stop offset="52%" stop-color="#6f7bbf"/><stop offset="100%" stop-color="#e0964a"/></linearGradient>
    <linearGradient id="mtr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff7a3c"/><stop offset="48%" stop-color="#e8b25a"/><stop offset="100%" stop-color="#2ee06a"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.09"/><stop offset="100%" stop-color="#fff" stop-opacity="0.025"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8a4f25"/><stop offset="25%" stop-color="#e6a062"/><stop offset="45%" stop-color="#ffe9c8"/><stop offset="62%" stop-color="#c77b3e"/><stop offset="100%" stop-color="#8a4f25"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4cc2ff"/><stop offset="45%" stop-color="#7d88c8"/><stop offset="78%" stop-color="#e0964a"/><stop offset="100%" stop-color="#2ee06a"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#070a11" stop-opacity="0"/><stop offset="100%" stop-color="#0a0f1a" stop-opacity="0.95"/></linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="1000" height="720" fill="#070a11"/>
  <g filter="url(#soft)" opacity="0.85">
    <circle cx="180" cy="160" r="180" fill="url(#bs)"/><circle cx="120" cy="520" r="160" fill="url(#bc)"/>
    <circle cx="820" cy="120" r="200" fill="url(#bc)"/><circle cx="900" cy="520" r="190" fill="url(#ba)"/><circle cx="540" cy="650" r="150" fill="url(#bgn)"/>
  </g>

  <!-- explainer -->
  <g transform="translate(60,80)" fill="#9aa6c4">
    <text font-size="22" font-weight="800" fill="#eaf2ff">Sections = your stack.</text>
    <text y="34" font-size="14">The top rail is generated from the sources</text>
    <text y="56" font-size="14">you've connected — 1 or 6, it adapts.</text>
    <text y="92" font-size="13" fill="#6b7799">· <tspan fill="#4cc2ff" font-weight="700">Ask</tspan> = the always-present front door.</text>
    <text y="114" font-size="13" fill="#6b7799">  Auto-scopes everything you've wired up.</text>
    <text y="146" font-size="13" fill="#6b7799">· Each source = a focused section.</text>
    <text y="178" font-size="13" fill="#6b7799">· Brain runs <tspan fill="#2ee06a" font-weight="700">in-extension</tspan> — no server,</text>
    <text y="200" font-size="13" fill="#6b7799">  no extra tab. The panel just docks.</text>
    <text y="250" font-size="12" fill="#5f6b80">Web dashboard → demoted to optional</text>
    <text y="268" font-size="12" fill="#5f6b80">team host. Not a daily-driver tab.</text>
  </g>

  <!-- ============ SIDE PANEL (Discord section open) ============ -->
  <g transform="translate(500,30)">
    <g filter="url(#drop)"><rect width="440" height="660" rx="22" fill="url(#gl)" stroke="#fff" stroke-opacity="0.11"/></g>
    <!-- brand -->
    <rect x="22" y="22" width="40" height="40" rx="13" fill="url(#g)"/><text x="42" y="48" text-anchor="middle" fill="#061018" font-size="15" font-weight="800">&lt;/&gt;</text>
    <text x="74" y="34" fill="#4cc2ff" font-size="10" letter-spacing="2.2" font-weight="700">FLYONWALL · COMMUNITY BRAIN</text>
    <text x="74" y="58" font-size="20" font-weight="800" fill="url(#g)">Help Me Comms</text>

    <!-- DYNAMIC SOURCE RAIL (copper frame, Discord active) -->
    <g transform="translate(22,78)">
      <rect x="-2" y="-2" width="400" height="48" rx="17" fill="none" stroke="url(#copper)" stroke-opacity="0.5" stroke-width="3.5" filter="url(#glow)"/>
      <rect width="396" height="44" rx="15" fill="url(#gl)" stroke="url(#copper)" stroke-width="1.8"/>
      <!-- active pill: Discord (blurple) -->
      <rect x="62" y="5" width="92" height="34" rx="11" fill="#5865f2" filter="url(#glow)"/>
      <rect x="62" y="5" width="92" height="34" rx="11" fill="#5865f2"/>
      <g font-size="12" font-weight="700">
        <circle cx="20" cy="22" r="3.5" fill="#4cc2ff"/><text x="34" y="26" fill="#9aa6c4">Ask</text>
        <text x="108" y="26" text-anchor="middle" fill="#fff">Discord</text>
        <circle cx="178" cy="22" r="3.5" fill="#ff4500"/><text x="210" y="26" text-anchor="middle" fill="#9aa6c4">Reddit</text>
        <circle cx="262" cy="22" r="3.5" fill="#66c0f4"/><text x="292" y="26" text-anchor="middle" fill="#9aa6c4">Steam</text>
        <circle cx="338" cy="22" r="3.5" fill="#2ee06a"/><text x="366" y="26" text-anchor="middle" fill="#9aa6c4">Forum</text>
      </g>
      <!-- scroll fade hinting more -->
      <rect x="360" y="2" width="34" height="40" rx="14" fill="url(#fade)"/>
      <text x="384" y="26" text-anchor="middle" fill="#6b7799" font-size="13">›</text>
    </g>

    <!-- source header card -->
    <g transform="translate(22,138)">
      <rect width="396" height="118" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
      <circle cx="24" cy="28" r="6" fill="#5865f2"/><text x="40" y="33" fill="#eaf2ff" font-size="15" font-weight="800">Discord</text>
      <text x="380" y="32" text-anchor="end" fill="#6b7799" font-size="10" letter-spacing="1">APPROVAL-GATED</text>
      <!-- capability chips -->
      <g font-size="10">
        <rect x="16" y="46" width="46" height="20" rx="10" fill="#2ee06a"/><text x="39" y="60" text-anchor="middle" fill="#06150d" font-weight="700">read</text>
        <rect x="68" y="46" width="120" height="20" rx="10" fill="#e0964a"/><text x="128" y="60" text-anchor="middle" fill="#1a0f06" font-weight="700">write: approval required</text>
        <rect x="194" y="46" width="56" height="20" rx="10" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><text x="222" y="60" text-anchor="middle" fill="#9aa6c4">threads</text>
        <rect x="256" y="46" width="52" height="20" rx="10" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><text x="282" y="60" text-anchor="middle" fill="#9aa6c4">search</text>
        <rect x="314" y="46" width="60" height="20" rx="10" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><text x="344" y="60" text-anchor="middle" fill="#9aa6c4">realtime</text>
      </g>
      <text x="16" y="86" fill="#6b7799" font-size="10" letter-spacing="2">APPROVED SPACES</text>
      <g font-size="11" fill="#dbe3ee">
        <rect x="16" y="92" width="74" height="20" rx="10" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><text x="53" y="106" text-anchor="middle">#support</text>
        <rect x="96" y="92" width="92" height="20" rx="10" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><text x="142" y="106" text-anchor="middle">#bug-reports</text>
        <rect x="194" y="92" width="74" height="20" rx="10" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><text x="231" y="106" text-anchor="middle">#feedback</text>
      </g>
    </g>

    <!-- scoped composer -->
    <g transform="translate(22,266)">
      <rect width="396" height="76" rx="14" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
      <rect x="10" y="10" width="376" height="34" rx="11" fill="#03060e" fill-opacity="0.55" stroke="#5865f2" stroke-opacity="0.4"/>
      <text x="22" y="32" fill="#9aa6c4" font-size="12.5">crashing at factory boss intro</text>
      <text x="14" y="62" fill="#6b7799" font-size="10.5">Scoped to Discord only</text>
      <rect x="276" y="48" width="110" height="20" rx="10" fill="#5865f2"/><text x="331" y="62" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="700">Search Discord ✦</text>
    </g>

    <!-- scoped result -->
    <g transform="translate(22,354)">
      <rect x="0.8" y="0.8" width="394" height="276" rx="16" fill="none" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.5"/>
      <rect width="396" height="278" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
      <rect x="16" y="16" width="92" height="22" rx="11" fill="#4cc2ff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.14"/><text x="62" y="31" text-anchor="middle" fill="#eaf2ff" font-size="11" font-weight="700">crash support</text>
      <text x="16" y="62" fill="#dce6ff" font-size="13">Top Discord signal: several users mention</text>
      <text x="16" y="80" fill="#dce6ff" font-size="13">crashes at the same stage after patch 1.4.2.</text>
      <text x="16" y="110" fill="#6b7799" font-size="10" letter-spacing="2">CONFIDENCE</text>
      <rect x="16" y="118" width="300" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
      <rect x="16" y="118" width="190" height="9" rx="4.5" fill="url(#mtr)" filter="url(#glow)"/><rect x="16" y="118" width="190" height="9" rx="4.5" fill="url(#mtr)"/>
      <circle cx="206" cy="122.5" r="6" fill="#2ee06a" opacity="0.9" filter="url(#glow)"/><circle cx="206" cy="122.5" r="3.5" fill="#eafff2"/>
      <text x="380" y="127" text-anchor="end" fill="#eaf2ff" font-size="12" font-weight="800">63%</text>
      <text x="16" y="156" fill="#6b7799" font-size="10" letter-spacing="2">DISCORD EVIDENCE</text>
      <rect x="16" y="164" width="364" height="44" rx="11" fill="#fff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.08"/>
      <circle cx="30" cy="180" r="4" fill="#5865f2"/><text x="42" y="184" fill="#9aa6c4" font-size="10" letter-spacing="1">DISCORD</text>
      <text x="16" y="200" fill="#dce6ff" font-size="12">Mod suggests verifying files + disabling recent visual mods.</text>
      <circle cx="20" cy="244" r="4" fill="#2ee06a"/><text x="32" y="248" fill="#6b7799" font-size="10.5">Evidence is scoped and discarded after the task.</text>
    </g>
  </g>
</svg>
