<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38e8ff" stop-opacity="0.95"/><stop offset="100%" stop-color="#38e8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobV" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8b5cff" stop-opacity="0.95"/><stop offset="100%" stop-color="#8b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobM" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d9d" stop-opacity="0.9"/><stop offset="100%" stop-color="#ff4d9d" stop-opacity="0"/></radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38e8ff"/><stop offset="48%" stop-color="#8b5cff"/><stop offset="100%" stop-color="#ff4d9d"/></linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff4d9d"/><stop offset="45%" stop-color="#ffc14d"/><stop offset="100%" stop-color="#b6ff5a"/></linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>
    <radialGradient id="vig" cx="50%" cy="38%" r="75%"><stop offset="55%" stop-color="#05060c" stop-opacity="0"/><stop offset="100%" stop-color="#05060c" stop-opacity="0.85"/></radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- ===== animated-look aurora base ===== -->
  <rect width="980" height="640" fill="#05060c"/>
  <g filter="url(#soft)" opacity="0.9">
    <circle cx="210" cy="180" r="180" fill="url(#blobV)"/>
    <circle cx="120" cy="430" r="150" fill="url(#blobC)"/>
    <circle cx="330" cy="560" r="150" fill="url(#blobM)"/>
    <circle cx="700" cy="120" r="200" fill="url(#blobC)"/>
    <circle cx="900" cy="360" r="190" fill="url(#blobV)"/>
    <circle cx="650" cy="600" r="170" fill="url(#blobM)"/>
  </g>
  <rect width="980" height="640" fill="url(#vig)"/>
  <text x="40" y="36" fill="#9aa6c4" font-size="13" letter-spacing="0.5">Toolbar popup</text>
  <text x="560" y="36" fill="#9aa6c4" font-size="13" letter-spacing="0.5">Side panel · live community_help result</text>

  <!-- ========================= POPUP ========================= -->
  <g transform="translate(40,56)">
    <rect width="344" height="290" rx="22" fill="url(#glassG)" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- brand -->
    <rect x="20" y="22" width="40" height="40" rx="13" fill="url(#grad)"/>
    <text x="40" y="48" text-anchor="middle" fill="#061018" font-size="15" font-weight="800">&lt;/&gt;</text>
    <text x="72" y="34" fill="#38e8ff" font-size="10" letter-spacing="2.4" font-weight="700">FLYONWALL · COMMS</text>
    <text x="72" y="58" font-size="23" font-weight="800" fill="url(#grad)" filter="url(#glow)">Help Me</text>
    <text x="72" y="58" font-size="23" font-weight="800" fill="url(#grad)">Help Me</text>

    <!-- actions -->
    <g font-size="13.5" fill="#eaf2ff">
      <g transform="translate(20,84)">
        <rect width="304" height="48" rx="15" fill="url(#glassG)" stroke="#38e8ff" stroke-opacity="0.45"/>
        <rect x="11" y="9" width="30" height="30" rx="10" fill="#8b5cff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="26" y="29" text-anchor="middle" fill="#38e8ff" font-size="14">⌁</text>
        <text x="52" y="29">Ask about <tspan font-weight="700">selected text</tspan></text>
        <text x="288" y="30" fill="#38e8ff" font-size="18">›</text>
      </g>
      <g transform="translate(20,142)">
        <rect width="304" height="48" rx="15" fill="url(#glassG)" stroke="#ffffff" stroke-opacity="0.10"/>
        <rect x="11" y="9" width="30" height="30" rx="10" fill="#8b5cff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="26" y="29" text-anchor="middle" fill="#38e8ff" font-size="14">◎</text>
        <text x="52" y="29">Ask about <tspan font-weight="700">visible page</tspan></text>
        <text x="288" y="30" fill="#6b7799" font-size="18">›</text>
      </g>
      <g transform="translate(20,200)">
        <rect width="304" height="48" rx="15" fill="url(#glassG)" stroke="#ffffff" stroke-opacity="0.10"/>
        <rect x="11" y="9" width="30" height="30" rx="10" fill="#8b5cff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="26" y="29" text-anchor="middle" fill="#8b5cff" font-size="14">▤</text>
        <text x="52" y="29">Open <tspan font-weight="700">side panel</tspan></text>
        <text x="288" y="30" fill="#6b7799" font-size="18">›</text>
      </g>
    </g>
    <circle cx="26" cy="270" r="3.5" fill="#b6ff5a"/>
    <text x="38" y="274" fill="#9aa6c4" font-size="11">Nothing is posted or submitted automatically.</text>
  </g>

  <!-- ========================= SIDE PANEL ========================= -->
  <g transform="translate(560,56)">
    <rect width="380" height="540" rx="22" fill="url(#glassG)" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- brand -->
    <rect x="20" y="20" width="40" height="40" rx="13" fill="url(#grad)"/>
    <text x="40" y="46" text-anchor="middle" fill="#061018" font-size="15" font-weight="800">&lt;/&gt;</text>
    <text x="72" y="32" fill="#38e8ff" font-size="10" letter-spacing="2.2" font-weight="700">FLYONWALL · COMMUNITY BRAIN</text>
    <text x="72" y="56" font-size="20" font-weight="800" fill="url(#grad)">Help Me Comms</text>

    <!-- composer -->
    <g transform="translate(20,76)">
      <rect width="340" height="96" rx="14" fill="url(#glassG)" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="10" y="10" width="320" height="50" rx="11" fill="#03060e" fill-opacity="0.55" stroke="#38e8ff" stroke-opacity="0.45"/>
      <text x="22" y="32" fill="#eaf2ff" font-size="13">I'm crashing at the factory boss intro.</text>
      <text x="22" y="50" fill="#eaf2ff" font-size="13">What do I do?</text>
      <text x="14" y="84" fill="#6b7799" font-size="10.5">Reads only what you paste or select</text>
      <rect x="224" y="68" width="106" height="32" rx="12" fill="url(#grad)"/>
      <text x="277" y="89" text-anchor="middle" fill="#06121a" font-size="12.5" font-weight="700">Ask Help Me ✦</text>
    </g>

    <!-- result card -->
    <g transform="translate(20,188)">
      <rect width="340" height="332" rx="16" fill="url(#glassG)" stroke="#ffffff" stroke-opacity="0.10"/>
      <!-- chips -->
      <rect x="14" y="14" width="112" height="22" rx="11" fill="#b6ff5a"/>
      <text x="70" y="29" text-anchor="middle" fill="#07150d" font-size="10.5" font-weight="700">needs followup</text>
      <rect x="132" y="14" width="92" height="22" rx="11" fill="#8b5cff" fill-opacity="0.20" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="178" y="29" text-anchor="middle" fill="#eaf2ff" font-size="10.5" font-weight="700">crash support</text>

      <!-- confidence -->
      <text x="14" y="60" fill="#6b7799" font-size="10" letter-spacing="2">CONFIDENCE</text>
      <rect x="14" y="68" width="270" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="14" y="68" width="170" height="8" rx="4" fill="url(#meter)" filter="url(#glow)"/>
      <rect x="14" y="68" width="170" height="8" rx="4" fill="url(#meter)"/>
      <text x="326" y="76" text-anchor="end" fill="#eaf2ff" font-size="12" font-weight="800">63%</text>

      <!-- answer -->
      <text x="14" y="100" fill="#dce6ff" font-size="12.5">This looks like a crash-support issue. Based on</text>
      <text x="14" y="117" fill="#dce6ff" font-size="12.5">the strongest matching community evidence, start</text>
      <text x="14" y="134" fill="#dce6ff" font-size="12.5">with these steps: verify files, disable recent…</text>

      <!-- sources -->
      <text x="14" y="160" fill="#6b7799" font-size="10" letter-spacing="2">SOURCES SCOPED</text>
      <g font-size="11.5" fill="#eaf2ff">
        <rect x="14" y="168" width="78" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
        <circle cx="27" cy="180" r="4" fill="#5865f2"/><text x="38" y="184">Discord</text>
        <rect x="98" y="168" width="74" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
        <circle cx="111" cy="180" r="4" fill="#ff4500"/><text x="122" y="184">Reddit</text>
        <rect x="178" y="168" width="72" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
        <circle cx="191" cy="180" r="4" fill="#66c0f4"/><text x="202" y="184">Steam</text>
        <rect x="256" y="168" width="68" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
        <circle cx="269" cy="180" r="4" fill="#b6ff5a"/><text x="280" y="184">Forum</text>
      </g>

      <!-- followup -->
      <rect x="14" y="202" width="312" height="34" rx="12" fill="#38e8ff" fill-opacity="0.07" stroke="#38e8ff" stroke-opacity="0.22"/>
      <text x="26" y="223" fill="#38e8ff" font-size="14">✦</text>
      <text x="42" y="223" fill="#cdeffb" font-size="11.5">What platform, version, and recent changes?</text>

      <!-- actions -->
      <text x="14" y="258" fill="#6b7799" font-size="10" letter-spacing="2">SUGGESTED NEXT ACTIONS</text>
      <g font-size="12.5" fill="#eaf2ff" font-weight="600">
        <rect x="14" y="266" width="312" height="26" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#8b5cff" stroke-opacity="0.45"/>
        <rect x="20" y="270" width="18" height="18" rx="6" fill="#8b5cff" fill-opacity="0.22"/><text x="29" y="283" text-anchor="middle" fill="#8b5cff" font-size="11">✎</text>
        <text x="46" y="283">Draft a known-issue FAQ</text>
        <rect x="262" y="271" width="58" height="16" rx="8" fill="none" stroke="#ffc14d" stroke-opacity="0.5"/>
        <text x="291" y="282" text-anchor="middle" fill="#ffc14d" font-size="8.5" letter-spacing="1">APPROVAL</text>

        <rect x="14" y="298" width="312" height="26" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
        <rect x="20" y="302" width="18" height="18" rx="6" fill="#8b5cff" fill-opacity="0.22"/><text x="29" y="315" text-anchor="middle" fill="#8b5cff" font-size="11">✎</text>
        <text x="46" y="315">Draft a reply asking for logs</text>
        <rect x="262" y="303" width="58" height="16" rx="8" fill="none" stroke="#ffc14d" stroke-opacity="0.5"/>
        <text x="291" y="314" text-anchor="middle" fill="#ffc14d" font-size="8.5" letter-spacing="1">APPROVAL</text>
      </g>
    </g>
  </g>
</svg>
