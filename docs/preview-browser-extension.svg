<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="bc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38e8ff" stop-opacity="0.95"/><stop offset="100%" stop-color="#38e8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bv" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#8b5cff" stop-opacity="0.95"/><stop offset="100%" stop-color="#8b5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bm" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d9d" stop-opacity="0.9"/><stop offset="100%" stop-color="#ff4d9d" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38e8ff"/><stop offset="48%" stop-color="#8b5cff"/><stop offset="100%" stop-color="#ff4d9d"/></linearGradient>
    <linearGradient id="mtr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff4d9d"/><stop offset="45%" stop-color="#ffc14d"/><stop offset="100%" stop-color="#b6ff5a"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.10"/><stop offset="100%" stop-color="#fff" stop-opacity="0.02"/></linearGradient>
    <radialGradient id="vig" cx="50%" cy="36%" r="75%"><stop offset="52%" stop-color="#05060c" stop-opacity="0"/><stop offset="100%" stop-color="#05060c" stop-opacity="0.85"/></radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="1000" height="660" fill="#05060c"/>
  <g filter="url(#soft)" opacity="0.9">
    <circle cx="200" cy="170" r="180" fill="url(#bv)"/>
    <circle cx="120" cy="450" r="150" fill="url(#bc)"/>
    <circle cx="330" cy="580" r="150" fill="url(#bm)"/>
    <circle cx="720" cy="110" r="210" fill="url(#bc)"/>
    <circle cx="930" cy="380" r="200" fill="url(#bv)"/>
    <circle cx="660" cy="620" r="180" fill="url(#bm)"/>
  </g>
  <rect width="1000" height="660" fill="url(#vig)"/>
  <text x="40" y="34" fill="#9aa6c4" font-size="13">Toolbar popup</text>
  <text x="470" y="34" fill="#9aa6c4" font-size="13">Side panel · accent tabs + spatial depth (Evidence tab open)</text>

  <!-- ============ POPUP ============ -->
  <g transform="translate(40,58)" filter="url(#drop)">
    <rect width="320" height="280" rx="22" fill="url(#gl)" stroke="#fff" stroke-opacity="0.12"/>
    <rect x="20" y="22" width="38" height="38" rx="12" fill="url(#g)"/>
    <text x="39" y="47" text-anchor="middle" fill="#061018" font-size="14" font-weight="800">&lt;/&gt;</text>
    <text x="70" y="34" fill="#38e8ff" font-size="9.5" letter-spacing="2.2" font-weight="700">FLYONWALL · COMMS</text>
    <text x="70" y="57" font-size="21" font-weight="800" fill="url(#g)">Help Me</text>
    <g font-size="13" fill="#eaf2ff">
      <g transform="translate(20,82)"><rect width="280" height="46" rx="14" fill="url(#gl)" stroke="#38e8ff" stroke-opacity="0.4"/><rect x="10" y="8" width="28" height="28" rx="9" fill="#8b5cff" fill-opacity="0.18"/><text x="24" y="28" text-anchor="middle" fill="#38e8ff" font-size="13">⌁</text><text x="48" y="28">Ask about <tspan font-weight="700">selected text</tspan></text></g>
      <g transform="translate(20,136)"><rect width="280" height="46" rx="14" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/><rect x="10" y="8" width="28" height="28" rx="9" fill="#8b5cff" fill-opacity="0.18"/><text x="24" y="28" text-anchor="middle" fill="#38e8ff" font-size="13">◎</text><text x="48" y="28">Ask about <tspan font-weight="700">visible page</tspan></text></g>
      <g transform="translate(20,190)"><rect width="280" height="46" rx="14" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/><rect x="10" y="8" width="28" height="28" rx="9" fill="#8b5cff" fill-opacity="0.18"/><text x="24" y="28" text-anchor="middle" fill="#8b5cff" font-size="13">▤</text><text x="48" y="28">Open <tspan font-weight="700">side panel</tspan></text></g>
    </g>
    <circle cx="26" cy="258" r="3.5" fill="#b6ff5a"/><text x="38" y="262" fill="#9aa6c4" font-size="10.5">Nothing is posted automatically.</text>
  </g>

  <!-- ============ SIDE PANEL ============ -->
  <g transform="translate(470,52)">
    <!-- parallax depth ghost -->
    <rect x="14" y="20" width="392" height="556" rx="24" fill="#8b5cff" opacity="0.06" filter="url(#soft)"/>
    <g filter="url(#drop)">
      <rect width="392" height="556" rx="22" fill="url(#gl)" stroke="#fff" stroke-opacity="0.12"/>
    </g>
    <!-- brand (floats highest) -->
    <rect x="20" y="20" width="40" height="40" rx="13" fill="url(#g)"/>
    <text x="40" y="46" text-anchor="middle" fill="#061018" font-size="15" font-weight="800">&lt;/&gt;</text>
    <text x="72" y="32" fill="#38e8ff" font-size="10" letter-spacing="2.2" font-weight="700">FLYONWALL · COMMUNITY BRAIN</text>
    <text x="72" y="56" font-size="20" font-weight="800" fill="url(#g)">Help Me Comms</text>

    <!-- ACCENT TAB BAR — copper outline, magenta active pill (Evidence) -->
    <g transform="translate(20,76)">
      <rect x="-1.5" y="-1.5" width="355" height="49" rx="17.5" fill="none" stroke="#c77b3e" stroke-opacity="0.5" stroke-width="3" filter="url(#glow)"/>
      <rect width="352" height="46" rx="16" fill="url(#gl)" stroke="#e6a062" stroke-opacity="0.85" stroke-width="1.5" filter="url(#drop)"/>
      <!-- active pill: Evidence -->
      <rect x="181" y="5" width="86" height="36" rx="11" fill="#ff4d9d" filter="url(#glow)"/>
      <rect x="181" y="5" width="86" height="36" rx="11" fill="#ff4d9d"/>
      <g font-size="11.5" font-weight="700">
        <circle cx="34" cy="23" r="3.5" fill="#38e8ff"/><text x="50" y="27" fill="#9aa6c4">Ask</text>
        <circle cx="108" cy="23" r="3.5" fill="#8b5cff"/><text x="124" y="27" fill="#9aa6c4">Answer</text>
        <text x="224" y="27" fill="#06121a" text-anchor="middle">Evidence</text>
        <circle cx="294" cy="23" r="3.5" fill="#b6ff5a"/><text x="310" y="27" fill="#9aa6c4">Actions</text>
      </g>
    </g>

    <!-- EVIDENCE view card -->
    <g transform="translate(20,138)" filter="url(#drop)">
      <rect width="352" height="392" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
    </g>
    <g transform="translate(20,138)">
      <!-- confidence -->
      <text x="16" y="34" fill="#6b7799" font-size="10" letter-spacing="2">CONFIDENCE</text>
      <rect x="16" y="44" width="282" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
      <rect x="16" y="44" width="178" height="9" rx="4.5" fill="url(#mtr)" filter="url(#glow)"/>
      <rect x="16" y="44" width="178" height="9" rx="4.5" fill="url(#mtr)"/>
      <text x="336" y="53" text-anchor="end" fill="#eaf2ff" font-size="13" font-weight="800">63%</text>

      <!-- sources -->
      <text x="16" y="86" fill="#6b7799" font-size="10" letter-spacing="2">SOURCES SCOPED</text>
      <g font-size="12" fill="#eaf2ff">
        <rect x="16" y="96" width="84" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.10"/><circle cx="31" cy="109" r="4.5" fill="#5865f2"/><text x="42" y="113">Discord</text>
        <rect x="108" y="96" width="78" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.10"/><circle cx="123" cy="109" r="4.5" fill="#ff4500"/><text x="134" y="113">Reddit</text>
        <rect x="194" y="96" width="76" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.10"/><circle cx="209" cy="109" r="4.5" fill="#66c0f4"/><text x="220" y="113">Steam</text>
        <rect x="278" y="96" width="72" height="26" rx="13" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.10"/><circle cx="293" cy="109" r="4.5" fill="#b6ff5a"/><text x="304" y="113">Forum</text>
      </g>

      <!-- evidence snippet lines -->
      <text x="16" y="156" fill="#6b7799" font-size="10" letter-spacing="2">TOP EVIDENCE</text>
      <rect x="16" y="166" width="334" height="64" rx="12" fill="#fff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.08"/>
      <circle cx="30" cy="184" r="4" fill="#5865f2"/>
      <text x="42" y="188" fill="#dce6ff" font-size="12">Several users mention crashes around the</text>
      <text x="16" y="206" fill="#dce6ff" font-size="12">same stage transition after the latest patch.</text>
      <text x="16" y="222" fill="#6b7799" font-size="10.5">discord · 6 confirmations · 2d ago</text>

      <rect x="16" y="242" width="334" height="64" rx="12" fill="#fff" fill-opacity="0.03" stroke="#fff" stroke-opacity="0.08"/>
      <circle cx="30" cy="260" r="4" fill="#66c0f4"/>
      <text x="42" y="264" fill="#dce6ff" font-size="12">Verify files, disable recent visual/animation</text>
      <text x="16" y="282" fill="#dce6ff" font-size="12">changes, and retest from an earlier save.</text>
      <text x="16" y="298" fill="#6b7799" font-size="10.5">steam_reviews · resolved</text>

      <!-- privacy -->
      <circle cx="20" cy="344" r="4" fill="#b6ff5a"/>
      <text x="32" y="348" fill="#6b7799" font-size="10.5">Scoped evidence is temporary and discarded after the task.</text>
    </g>
  </g>
</svg>
