<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="864" viewBox="0 0 1200 864" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="bc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4cc2ff" stop-opacity="0.8"/><stop offset="100%" stop-color="#4cc2ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="bs" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6f7bbf" stop-opacity="0.75"/><stop offset="100%" stop-color="#6f7bbf" stop-opacity="0"/></radialGradient>
    <radialGradient id="ba" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e0964a" stop-opacity="0.55"/><stop offset="100%" stop-color="#e0964a" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgn" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2ee06a" stop-opacity="0.3"/><stop offset="100%" stop-color="#2ee06a" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4cc2ff"/><stop offset="52%" stop-color="#6f7bbf"/><stop offset="100%" stop-color="#e0964a"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.08"/><stop offset="100%" stop-color="#fff" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8a4f25"/><stop offset="25%" stop-color="#e6a062"/><stop offset="45%" stop-color="#ffe9c8"/><stop offset="62%" stop-color="#c77b3e"/><stop offset="100%" stop-color="#8a4f25"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4cc2ff"/><stop offset="45%" stop-color="#7d88c8"/><stop offset="78%" stop-color="#e0964a"/><stop offset="100%" stop-color="#2ee06a"/></linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
    <radialGradient id="vig" cx="50%" cy="30%" r="80%"><stop offset="55%" stop-color="#070a11" stop-opacity="0"/><stop offset="100%" stop-color="#070a11" stop-opacity="0.8"/></radialGradient>
  </defs>

  <!-- browser chrome -->
  <rect width="1200" height="864" fill="#0a0d15"/>
  <rect width="1200" height="40" fill="#11151f"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
  <rect x="300" y="11" width="600" height="18" rx="9" fill="#070a11"/>
  <text x="600" y="24" text-anchor="middle" fill="#6b7799" font-size="11">localhost:3000  ·  Help Me Comms</text>

  <!-- page bg -->
  <g transform="translate(0,40)">
    <rect width="1200" height="824" fill="#070a11"/>
    <g filter="url(#soft)" opacity="0.85">
      <circle cx="250" cy="120" r="200" fill="url(#bs)"/>
      <circle cx="1000" cy="90" r="220" fill="url(#bc)"/>
      <circle cx="1120" cy="520" r="220" fill="url(#bs)"/>
      <circle cx="120" cy="600" r="200" fill="url(#ba)"/>
      <circle cx="620" cy="760" r="200" fill="url(#bgn)"/>
    </g>
    <rect width="1200" height="824" fill="url(#vig)"/>

    <!-- topbar -->
    <g transform="translate(120,34)">
      <rect x="0" y="2" width="46" height="46" rx="15" fill="url(#g)"/>
      <text x="23" y="32" text-anchor="middle" fill="#061018" font-size="18" font-weight="800">&lt;/&gt;</text>
      <text x="60" y="18" fill="#4cc2ff" font-size="11" letter-spacing="2.6" font-weight="700">FLYONWALL · COMMUNITY BRAIN</text>
      <text x="60" y="44" font-size="24" font-weight="800" fill="url(#g)">Help Me Comms</text>
      <g transform="translate(770,10)"><rect width="190" height="32" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.12"/><circle cx="20" cy="16" r="4.5" fill="#2ee06a"/><text x="34" y="20" fill="#9aa6c4" font-size="12.5">Mock sources online</text></g>
    </g>

    <!-- hero -->
    <g transform="translate(600,150)" text-anchor="middle">
      <text font-size="34" font-weight="800" fill="#eaf2ff">Ask what the community is <tspan fill="#e0964a">actually saying</tspan>.</text>
      <text y="34" font-size="15" fill="#9aa6c4">Troubleshoot, correlate issues across Discord, Reddit, Steam and forums, draft a reply,</text>
      <text y="56" font-size="15" fill="#9aa6c4">or pull ideas — approval-first actions, ephemeral evidence.</text>
    </g>

    <!-- ASK CONSOLE -->
    <g transform="translate(280,250)">
      <rect x="-2" y="-2" width="644" height="324" rx="22" fill="none" stroke="url(#neon)" stroke-width="1.6" stroke-opacity="0.5"/>
      <rect width="640" height="320" rx="20" fill="url(#gl)" stroke="#fff" stroke-opacity="0.11" filter="url(#drop)"/>
      <!-- composer -->
      <rect x="18" y="18" width="604" height="74" rx="13" fill="#03060e" fill-opacity="0.55" stroke="#4cc2ff" stroke-opacity="0.45"/>
      <text x="32" y="44" fill="#eaf2ff" font-size="14.5">I'm crashing at the factory boss intro. What do I do?</text>
      <text x="32" y="78" fill="#6b7799" font-size="11.5">Scopes connected sources · drafts approval-gated · evidence ephemeral</text>
      <rect x="490" y="100" width="132" height="34" rx="13" fill="url(#g)"/>
      <text x="556" y="122" text-anchor="middle" fill="#06121a" font-size="13" font-weight="700">Ask Help Me ✦</text>

      <!-- tab bar (copper, Answer active=slate) -->
      <g transform="translate(18,146)">
        <rect x="-1.5" y="-1.5" width="607" height="43" rx="15" fill="url(#gl)" stroke="url(#copper)" stroke-width="2"/>
        <rect x="4" y="4" width="196" height="32" rx="11" fill="#7d88c8"/>
        <text x="102" y="25" text-anchor="middle" fill="#0a0f1a" font-size="12.5" font-weight="700">Answer</text>
        <circle cx="214" cy="20" r="3.5" fill="#e0964a"/><text x="300" y="24" text-anchor="middle" fill="#9aa6c4" font-size="12.5" font-weight="700">Evidence</text>
        <circle cx="410" cy="20" r="3.5" fill="#2ee06a"/><text x="500" y="24" text-anchor="middle" fill="#9aa6c4" font-size="12.5" font-weight="700">Actions</text>
      </g>
      <!-- answer view -->
      <g transform="translate(18,202)">
        <rect x="0" y="0" width="120" height="24" rx="12" fill="rgba(255,255,255,.06)"/>
        <rect x="0" y="0" width="120" height="24" rx="12" fill="#11151f"/><text x="60" y="16" text-anchor="middle" fill="#9aa6c4" font-size="11" font-weight="700">needs followup</text>
        <rect x="130" y="0" width="120" height="24" rx="12" fill="#4cc2ff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.14"/><text x="190" y="16" text-anchor="middle" fill="#eaf2ff" font-size="11" font-weight="700">crash support</text>
        <text x="0" y="50" fill="#dce6ff" font-size="14">This looks like a crash-support issue. Based on the strongest matching</text>
        <text x="0" y="70" fill="#dce6ff" font-size="14">community evidence, start with these steps: verify files, disable recent…</text>
        <rect x="0" y="84" width="604" height="34" rx="12" fill="#4cc2ff" fill-opacity="0.07" stroke="#4cc2ff" stroke-opacity="0.22"/>
        <text x="14" y="106" fill="#4cc2ff" font-size="14">✦</text><text x="32" y="106" fill="#cdeffb" font-size="13">What platform, game/mod version, and recent changes are involved?</text>
      </g>
    </g>

    <!-- WORKSPACE CARDS -->
    <text x="120" y="612" fill="#6b7799" font-size="13" letter-spacing="2">WORKSPACE</text>
    <g font-family="ui-sans-serif">
      <!-- row of 3 -->
      <g transform="translate(120,628)">
        <g><rect width="307" height="92" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/><rect x="16" y="16" width="34" height="34" rx="10" fill="#4cc2ff" fill-opacity="0.14" stroke="#4cc2ff" stroke-opacity="0.3"/><text x="33" y="39" text-anchor="middle" fill="#4cc2ff" font-size="15">✦</text><text x="16" y="74" fill="#eaf2ff" font-size="15" font-weight="700">Help Me Inbox</text></g>
        <g transform="translate(327,0)"><rect width="307" height="92" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/><rect x="16" y="16" width="34" height="34" rx="10" fill="#7d88c8" fill-opacity="0.16" stroke="#7d88c8" stroke-opacity="0.3"/><text x="33" y="39" text-anchor="middle" fill="#7d88c8" font-size="15">◎</text><text x="16" y="74" fill="#eaf2ff" font-size="15" font-weight="700">Evidence</text></g>
        <g transform="translate(654,0)"><rect width="307" height="92" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/><rect x="16" y="16" width="34" height="34" rx="10" fill="#e0964a" fill-opacity="0.16" stroke="#e0964a" stroke-opacity="0.3"/><text x="33" y="39" text-anchor="middle" fill="#e0964a" font-size="15">✎</text><text x="16" y="74" fill="#eaf2ff" font-size="15" font-weight="700">Drafts &amp; Approvals</text></g>
      </g>
      <g transform="translate(120,732)">
        <g><rect width="307" height="92" rx="16" fill="url(#gl)" stroke="#2ee06a" stroke-opacity="0.22"/><rect x="16" y="16" width="34" height="34" rx="10" fill="#2ee06a" fill-opacity="0.14" stroke="#2ee06a" stroke-opacity="0.35"/><text x="33" y="39" text-anchor="middle" fill="#2ee06a" font-size="15">▤</text><text x="16" y="74" fill="#eaf2ff" font-size="15" font-weight="700">Known Issues</text></g>
        <g transform="translate(327,0)"><rect width="307" height="92" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/><rect x="16" y="16" width="34" height="34" rx="10" fill="#4cc2ff" fill-opacity="0.14" stroke="#4cc2ff" stroke-opacity="0.3"/><text x="33" y="39" text-anchor="middle" fill="#4cc2ff" font-size="15">✺</text><text x="16" y="74" fill="#eaf2ff" font-size="15" font-weight="700">Idea Board</text></g>
        <g transform="translate(654,0)"><rect width="307" height="92" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/><rect x="16" y="16" width="34" height="34" rx="10" fill="#e0964a" fill-opacity="0.16" stroke="#e0964a" stroke-opacity="0.3"/><text x="33" y="39" text-anchor="middle" fill="#e0964a" font-size="15">⚙</text><text x="16" y="74" fill="#eaf2ff" font-size="15" font-weight="700">Provider &amp; Sources</text></g>
      </g>
    </g>
  </g>
</svg>
