        <circle cx="86" cy="21" r="3.5" fill="#2ee06a"/><text x="118" y="25" text-anchor="middle" fill="#9aa6c4">Pulse</text>
        <circle cx="176" cy="21" r="3.5" fill="#5865f2"/><text x="208" y="25" text-anchor="middle" fill="#9aa6c4">Discord</text>
        <circle cx="288" cy="21" r="3.5" fill="#ff4500"/><text x="318" y="25" text-anchor="middle" fill="#9aa6c4">Reddit</text>
        <text x="380" y="25" text-anchor="middle" fill="#6b7799">···</text>
      </g>
    </g>

