      <rect width="400" height="318" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
      <rect x="16" y="16" width="100" height="22" rx="11" fill="#2ee06a"/><text x="66" y="31" text-anchor="middle" fill="#06150d" font-size="11" font-weight="700">widespread</text>
