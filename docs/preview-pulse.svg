      <g>
        <rect width="432" height="70" rx="12" fill="#2ee06a" fill-opacity="0.05" stroke="#2ee06a" stroke-opacity="0.22"/>
        <rect x="11" y="11" width="28" height="28" rx="9" fill="#5865f2"/><text x="25" y="30" text-anchor="middle" fill="#06121a" font-size="12" font-weight="800">C</text>
        <circle cx="52" cy="21" r="3.5" fill="#ff7a3c"/><text x="62" y="25" fill="#dbe3ee" font-size="12" font-weight="700">ctd_andy</text>
        <rect x="132" y="14" width="44" height="14" rx="7" fill="none" stroke="#fff" stroke-opacity="0.14"/><text x="154" y="24" text-anchor="middle" fill="#6b7799" font-size="8">PLAYER</text>
        <rect x="182" y="13" width="52" height="16" rx="8" fill="#5865f2"/><text x="208" y="25" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">DISCORD</text>
        <text x="424" y="25" text-anchor="end" fill="#6b7799" font-size="10">just now</text>
        <text x="50" y="46" fill="#cfd8e8" font-size="12.5">same here, ctd at the boss every time. GTX 1080</text>
        <rect x="50" y="52" width="40" height="15" rx="7" fill="rgba(255,255,255,.04)" stroke="#fff" stroke-opacity="0.1"/><text x="70" y="63" text-anchor="middle" fill="#9aa6c4" font-size="9">▲ 2</text>
        <rect x="96" y="52" width="58" height="15" rx="7" fill="rgba(255,255,255,.04)" stroke="#fff" stroke-opacity="0.1"/><text x="125" y="63" text-anchor="middle" fill="#9aa6c4" font-size="9">+ me too</text>
      </g>
      <!-- Steam -->
      <g transform="translate(0,78)">
        <rect width="432" height="70" rx="12" fill="rgba(255,255,255,.03)" stroke="#fff" stroke-opacity="0.07"/>
        <rect x="11" y="11" width="28" height="28" rx="9" fill="#66c0f4"/><text x="25" y="30" text-anchor="middle" fill="#06121a" font-size="12" font-weight="800">R</text>
        <circle cx="52" cy="21" r="3.5" fill="#ff7a3c"/><text x="62" y="25" fill="#dbe3ee" font-size="12" font-weight="700">RefundRandy</text>
        <rect x="150" y="14" width="44" height="14" rx="7" fill="none" stroke="#fff" stroke-opacity="0.14"/><text x="172" y="24" text-anchor="middle" fill="#6b7799" font-size="8">PLAYER</text>
        <rect x="200" y="13" width="46" height="16" rx="8" fill="#66c0f4"/><text x="223" y="25" text-anchor="middle" fill="#06121a" font-size="8" font-weight="700">STEAM</text>
        <text x="424" y="25" text-anchor="end" fill="#6b7799" font-size="10">14m</text>
        <text x="50" y="46" fill="#cfd8e8" font-size="12.5">Unplayable after the patch. Hard-crashes at the boss</text>
