      <rect width="400" height="42" rx="15" fill="url(#gl)" stroke="url(#copper)" stroke-width="1.8"/>
      <rect x="5" y="5" width="60" height="32" rx="11" fill="#4cc2ff" filter="url(#glow)"/><rect x="5" y="5" width="60" height="32" rx="11" fill="#4cc2ff"/>
      <g font-size="12" font-weight="700">
