      <text x="16" y="26" fill="#2ee06a" font-size="14">✦</text>
      <text x="34" y="26" fill="#d7ffe6" font-size="12.5">You confirmed this <tspan fill="#2ee06a" font-weight="700">3×</tspan> from the feed across Discord, Steam — raising prevalence.</text>
    </g>

    <!-- answer card -->
    <g transform="translate(22,334)">
