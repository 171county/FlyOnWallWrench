        <rect x="11" y="11" width="28" height="28" rx="9" fill="#2ee06a"/><text x="25" y="30" text-anchor="middle" fill="#06121a" font-size="12" font-weight="800">D</text>
        <circle cx="52" cy="21" r="3.5" fill="#7d88c8"/><text x="62" y="25" fill="#dbe3ee" font-size="12" font-weight="700">Devlog_Dana</text>
        <rect x="158" y="14" width="58" height="14" rx="7" fill="none" stroke="#fff" stroke-opacity="0.14"/><text x="187" y="24" text-anchor="middle" fill="#6b7799" font-size="8">DEVELOPER</text>
        <rect x="222" y="13" width="46" height="16" rx="8" fill="#2ee06a"/><text x="245" y="25" text-anchor="middle" fill="#06150d" font-size="8" font-weight="700">FORUM</text>
