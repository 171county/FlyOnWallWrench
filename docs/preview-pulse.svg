        <rect x="100" y="86" width="70" height="26" rx="13" fill="#66c0f4" fill-opacity="0.13" stroke="#66c0f4" stroke-opacity="0.6"/><circle cx="114" cy="99" r="4" fill="#66c0f4"/><text x="126" y="103" fill="#eaf2ff">Steam</text>
        <rect x="178" y="86" width="70" height="26" rx="13" fill="rgba(255,255,255,.04)" stroke="#fff" stroke-opacity="0.1"/><circle cx="192" cy="99" r="4" fill="#ff4500"/><text x="204" y="103" fill="#9aa6c4">Reddit</text>
      </g>
      <rect x="262" y="86" width="126" height="34" rx="13" fill="url(#g)"/><text x="325" y="108" text-anchor="middle" fill="#06121a" font-size="12.5" font-weight="700">Check who else ✦</text>
    </g>

