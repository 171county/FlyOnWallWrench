      <text x="16" y="62" fill="#dce6ff" font-size="13">The factory-boss crash is widely reported and</text>
      <text x="16" y="80" fill="#dce6ff" font-size="13">trending after 1.4.2 — not isolated to you.</text>
      <text x="16" y="110" fill="#6b7799" font-size="10" letter-spacing="2">CONFIDENCE</text>
      <rect x="16" y="118" width="300" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
      <rect x="16" y="118" width="240" height="9" rx="4.5" fill="#2ee06a" filter="url(#glow)"/><rect x="16" y="118" width="240" height="9" rx="4.5" fill="#2ee06a"/>
      <circle cx="256" cy="122.5" r="6" fill="#2ee06a" opacity="0.9" filter="url(#glow)"/><circle cx="256" cy="122.5" r="3.5" fill="#eafff2"/>
      <text x="384" y="127" text-anchor="end" fill="#eaf2ff" font-size="12" font-weight="800">80%</text>
      <text x="16" y="156" fill="#6b7799" font-size="10" letter-spacing="2">WHO'S SEEING IT</text>
      <g font-size="11" fill="#dbe3ee">
        <rect x="16" y="164" width="74" height="22" rx="11" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><circle cx="30" cy="175" r="4" fill="#5865f2"/><text x="42" y="179">Discord</text>
        <rect x="96" y="164" width="62" height="22" rx="11" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.1"/><circle cx="110" cy="175" r="4" fill="#66c0f4"/><text x="122" y="179">Steam</text>
      </g>
      <rect x="16" y="200" width="368" height="34" rx="12" fill="#4cc2ff" fill-opacity="0.07" stroke="#4cc2ff" stroke-opacity="0.22"/>
      <text x="28" y="221" fill="#4cc2ff" font-size="13">✦</text><text x="44" y="221" fill="#cdeffb" font-size="11.5">Want to ask the community which fix they prefer?</text>
      <circle cx="20" cy="270" r="4" fill="#2ee06a"/><text x="32" y="274" fill="#6b7799" font-size="10.5">Scoped evidence is discarded after the task.</text>
    </g>
