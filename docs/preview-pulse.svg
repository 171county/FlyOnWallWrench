        <text x="96" y="25" text-anchor="middle" fill="#06150d">Pulse</text>
        <circle cx="152" cy="21" r="3.5" fill="#5865f2"/><text x="184" y="25" text-anchor="middle" fill="#9aa6c4">Discord</text>
        <circle cx="240" cy="21" r="3.5" fill="#ff4500"/><text x="270" y="25" text-anchor="middle" fill="#9aa6c4">Reddit</text>
        <circle cx="318" cy="21" r="3.5" fill="#66c0f4"/><text x="348" y="25" text-anchor="middle" fill="#9aa6c4">Steam</text>
        <circle cx="396" cy="21" r="3.5" fill="#2ee06a"/><text x="416" y="25" text-anchor="middle" fill="#9aa6c4">···</text>
      </g>
    </g>

    <!-- pulse head -->
