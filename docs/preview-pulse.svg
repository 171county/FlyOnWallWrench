    <circle cx="880" cy="140" r="200" fill="url(#bc)"/><circle cx="940" cy="560" r="180" fill="url(#ba)"/><circle cx="540" cy="680" r="150" fill="url(#bgn)"/>
  </g>
  <text x="40" y="34" fill="#8a96a8" font-size="13">Pulse · all sources interleaved (the home room)</text>
  <text x="556" y="34" fill="#8a96a8" font-size="13">Ask · your "me too" clicks raise prevalence</text>

  <!-- ================= PULSE PANEL ================= -->
  <g transform="translate(40,52)">
    <g filter="url(#drop)"><rect width="476" height="676" rx="22" fill="url(#gl)" stroke="#fff" stroke-opacity="0.11"/></g>
    <rect x="22" y="22" width="40" height="40" rx="13" fill="url(#g)"/><text x="42" y="48" text-anchor="middle" fill="#061018" font-size="15" font-weight="800">&lt;/&gt;</text>
    <text x="74" y="34" fill="#4cc2ff" font-size="10" letter-spacing="2.2" font-weight="700">FLYONWALL · COMMUNITY BRAIN</text>
    <text x="74" y="58" font-size="20" font-weight="800" fill="url(#g)">Help Me Comms</text>

    <!-- rail (Pulse active = green) -->
    <g transform="translate(22,78)">
      <rect x="-2" y="-2" width="436" height="46" rx="17" fill="none" stroke="url(#copper)" stroke-opacity="0.5" stroke-width="3.5" filter="url(#glow)"/>
      <rect width="432" height="42" rx="15" fill="url(#gl)" stroke="url(#copper)" stroke-width="1.8"/>
      <rect x="62" y="5" width="68" height="32" rx="11" fill="#2ee06a" filter="url(#glow)"/><rect x="62" y="5" width="68" height="32" rx="11" fill="#2ee06a"/>
      <g font-size="12" font-weight="700">
