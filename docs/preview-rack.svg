<svg xmlns="http://www.w3.org/2000/svg" width="540" height="900" viewBox="0 0 540 900" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="bs" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7d88c8" stop-opacity="0.6"/><stop offset="100%" stop-color="#7d88c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="bc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4cc2ff" stop-opacity="0.55"/><stop offset="100%" stop-color="#4cc2ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="ba" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e0964a" stop-opacity="0.45"/><stop offset="100%" stop-color="#e0964a" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4cc2ff"/><stop offset="52%" stop-color="#6f7bbf"/><stop offset="100%" stop-color="#e0964a"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity="0.09"/><stop offset="100%" stop-color="#fff" stop-opacity="0.025"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8a4f25"/><stop offset="25%" stop-color="#e6a062"/><stop offset="45%" stop-color="#ffe9c8"/><stop offset="62%" stop-color="#c77b3e"/><stop offset="100%" stop-color="#8a4f25"/></linearGradient>
    <linearGradient id="mtr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ff7a3c"/><stop offset="48%" stop-color="#e8b25a"/><stop offset="100%" stop-color="#2ee06a"/></linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="540" height="900" fill="#070a11"/>
  <g filter="url(#soft)" opacity="0.85"><circle cx="120" cy="150" r="160" fill="url(#bs)"/><circle cx="460" cy="420" r="170" fill="url(#bc)"/><circle cx="120" cy="760" r="160" fill="url(#ba)"/></g>

  <!-- brand -->
  <g transform="translate(24,26)">
    <rect width="40" height="40" rx="13" fill="url(#g)"/><text x="20" y="26" text-anchor="middle" fill="#061018" font-size="15" font-weight="800">&lt;/&gt;</text>
    <text x="52" y="14" fill="#4cc2ff" font-size="10" letter-spacing="2.2" font-weight="700">FLY ON THE WALL · COMMUNITY BRAIN</text>
    <text x="52" y="34" font-size="20" font-weight="800" fill="url(#g)">FOTW²</text>
  </g>

  <!-- rail w/ Rack active (slate) -->
  <g transform="translate(24,78)">
    <rect x="-2" y="-2" width="496" height="44" rx="16" fill="none" stroke="url(#copper)" stroke-opacity="0.5" stroke-width="3" filter="url(#glow)"/>
    <rect width="492" height="40" rx="14" fill="url(#gl)" stroke="url(#copper)" stroke-width="1.6"/>
    <rect x="58" y="4" width="64" height="32" rx="11" fill="#7d88c8" filter="url(#glow)"/><rect x="58" y="4" width="64" height="32" rx="11" fill="#7d88c8"/>
    <g font-size="11.5" font-weight="700">
      <circle cx="18" cy="20" r="3.5" fill="#4cc2ff"/><text x="32" y="24" fill="#9aa6c4">Ask</text>
      <text x="90" y="24" text-anchor="middle" fill="#0a0f1a">Rack</text>
      <circle cx="146" cy="20" r="3.5" fill="#2ee06a"/><text x="176" y="24" text-anchor="middle" fill="#9aa6c4">Pulse</text>
      <circle cx="230" cy="20" r="3.5" fill="#5865f2"/><text x="262" y="24" text-anchor="middle" fill="#9aa6c4">Discord</text>
      <text x="340" y="24" text-anchor="middle" fill="#6b7799">···</text>
    </g>
  </g>

  <!-- PEGBOARD -->
  <text x="24" y="146" fill="#6b7799" font-size="10" letter-spacing="2">YOUR WRENCHES · PAIR THE ONES YOU RUN</text>
  <g transform="translate(24,156)">
    <rect width="492" height="200" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
    <!-- pegboard grid hint -->
    <g stroke="#ffffff" stroke-opacity="0.03">
      <line x1="0" y1="22" x2="492" y2="22"/><line x1="0" y1="44" x2="492" y2="44"/><line x1="0" y1="66" x2="492" y2="66"/><line x1="0" y1="88" x2="492" y2="88"/><line x1="0" y1="110" x2="492" y2="110"/><line x1="0" y1="132" x2="492" y2="132"/><line x1="0" y1="154" x2="492" y2="154"/><line x1="0" y1="176" x2="492" y2="176"/>
    </g>
    <!-- FOTW² (cockpit) -->
    <g transform="translate(14,14)">
      <rect width="222" height="80" rx="14" fill="#7d88c8" fill-opacity="0.12" stroke="#7d88c8" stroke-opacity="0.6"/>
      <circle cx="206" cy="12" r="3.5" fill="#000" fill-opacity="0.5"/>
      <rect x="12" y="12" width="22" height="22" rx="7" fill="#7d88c8"/><text x="23" y="28" text-anchor="middle" fill="#06121a" font-size="11" font-weight="800">F</text>
      <text x="42" y="28" fill="#eaf2ff" font-size="14" font-weight="800">FOTW²</text>
      <text x="12" y="50" fill="#9aa6c4" font-size="10">Community brain · the cockpit</text>
      <text x="12" y="68" fill="#2ee06a" font-size="9" letter-spacing="1">COCKPIT</text>
    </g>
    <!-- ModWrench (paired) -->
    <g transform="translate(256,14)">
      <rect width="222" height="80" rx="14" fill="#4cc2ff" fill-opacity="0.12" stroke="#4cc2ff" stroke-opacity="0.6"/>
      <circle cx="206" cy="12" r="3.5" fill="#000" fill-opacity="0.5"/>
      <rect x="12" y="12" width="22" height="22" rx="7" fill="#4cc2ff"/><text x="23" y="28" text-anchor="middle" fill="#06121a" font-size="11" font-weight="800">M</text>
      <text x="42" y="28" fill="#eaf2ff" font-size="14" font-weight="800">ModWrench</text>
      <text x="12" y="50" fill="#9aa6c4" font-size="10">Mod platforms · load order · crashlog</text>
      <text x="12" y="68" fill="#2ee06a" font-size="9" letter-spacing="1">PAIRED</text>
    </g>
    <!-- DefWrench (paired) -->
    <g transform="translate(14,104)">
      <rect width="222" height="80" rx="14" fill="#e0964a" fill-opacity="0.12" stroke="#e0964a" stroke-opacity="0.6"/>
      <circle cx="206" cy="12" r="3.5" fill="#000" fill-opacity="0.5"/>
      <rect x="12" y="12" width="22" height="22" rx="7" fill="#e0964a"/><text x="23" y="28" text-anchor="middle" fill="#06121a" font-size="11" font-weight="800">D</text>
      <text x="42" y="28" fill="#eaf2ff" font-size="14" font-weight="800">DefWrench</text>
      <text x="12" y="50" fill="#9aa6c4" font-size="10">Studio toolchain · builds · tickets</text>
      <text x="12" y="68" fill="#2ee06a" font-size="9" letter-spacing="1">PAIRED</text>
    </g>
    <!-- MyneWrench (not paired) -->
    <g transform="translate(256,104)" opacity="0.55">
      <rect width="222" height="80" rx="14" fill="rgba(255,255,255,.04)" stroke="#fff" stroke-opacity="0.10"/>
      <circle cx="206" cy="12" r="3.5" fill="#000" fill-opacity="0.5"/>
      <rect x="12" y="12" width="22" height="22" rx="7" fill="#2ee06a"/><text x="23" y="28" text-anchor="middle" fill="#06121a" font-size="11" font-weight="800">M</text>
      <text x="42" y="28" fill="#eaf2ff" font-size="14" font-weight="800">MyneWrench</text>
      <text x="12" y="50" fill="#9aa6c4" font-size="10">Creator economies · Roblox · UEFN</text>
      <text x="12" y="68" fill="#6b7799" font-size="9" letter-spacing="1">TAP TO PAIR</text>
    </g>
  </g>

  <!-- THREAD -->
  <text x="24" y="384" fill="#6b7799" font-size="10" letter-spacing="2">CROSS-WRENCH THREAD</text>
  <g transform="translate(24,394)">
    <rect width="492" height="60" rx="14" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
    <rect x="12" y="10" width="468" height="22" rx="9" fill="#03060e" fill-opacity="0.5" stroke="#4cc2ff" stroke-opacity="0.45"/>
    <text x="24" y="25" fill="#eaf2ff" font-size="12.5">crashing at the factory boss</text>
    <text x="12" y="50" fill="#6b7799" font-size="10">Threads one story across your paired wrenches</text>
    <rect x="372" y="38" width="108" height="0" />
    <rect x="372" y="-0" width="0" height="0"/>
  </g>
  <rect x="408" y="404" width="100" height="30" rx="11" fill="url(#g)"/><text x="458" y="424" text-anchor="middle" fill="#06121a" font-size="12.5" font-weight="700">Thread it ✦</text>

  <!-- threaded story card -->
  <g transform="translate(24,468)" filter="url(#drop)">
    <rect width="492" height="396" rx="16" fill="url(#gl)" stroke="#fff" stroke-opacity="0.10"/>
  </g>
  <g transform="translate(40,488)">
    <text x="0" y="6" fill="#9aa6c4" font-size="12">“crashing at the factory boss” — threaded across 3 wrenches</text>
    <!-- confidence -->
    <text x="0" y="34" fill="#6b7799" font-size="10" letter-spacing="2">CONFIDENCE</text>
    <rect x="0" y="42" width="380" height="9" rx="4.5" fill="#fff" fill-opacity="0.08"/>
    <rect x="0" y="42" width="252" height="9" rx="4.5" fill="url(#mtr)" filter="url(#glow)"/><rect x="0" y="42" width="252" height="9" rx="4.5" fill="url(#mtr)"/>
    <circle cx="252" cy="46.5" r="6" fill="#2ee06a" opacity="0.9" filter="url(#glow)"/><circle cx="252" cy="46.5" r="3.5" fill="#eafff2"/>
    <text x="452" y="51" text-anchor="end" fill="#eaf2ff" font-size="12" font-weight="800">66%</text>

    <!-- chain -->
    <g transform="translate(0,72)">
      <!-- FOTW signal -->
      <line x1="13" y1="34" x2="13" y2="86" stroke="#7d88c8" stroke-width="2" opacity="0.5"/>
      <rect x="0" y="6" width="26" height="26" rx="8" fill="#7d88c8"/><text x="13" y="24" text-anchor="middle" fill="#06121a" font-size="11" font-weight="800">F</text>
      <text x="40" y="14" fill="#7d88c8" font-size="9.5" letter-spacing="1" font-weight="700">FOTW²</text>
      <text x="40" y="30" fill="#eaf2ff" font-size="13" font-weight="700">Community signal</text>
      <text x="40" y="47" fill="#cfd8e8" font-size="11.5">Widely reported across Discord, Steam — 63% confidence.</text>

      <!-- Mod cause -->
      <g transform="translate(0,86)">
        <line x1="13" y1="34" x2="13" y2="92" stroke="#4cc2ff" stroke-width="2" opacity="0.5"/>
        <rect x="0" y="6" width="26" height="26" rx="8" fill="#4cc2ff"/><text x="13" y="24" text-anchor="middle" fill="#06121a" font-size="11" font-weight="800">M</text>
        <text x="40" y="14" fill="#4cc2ff" font-size="9.5" letter-spacing="1" font-weight="700">MODWRENCH</text>
        <text x="40" y="30" fill="#eaf2ff" font-size="13" font-weight="700">Suspect mod in load order</text>
        <text x="40" y="47" fill="#cfd8e8" font-size="11.5">'HD Texture Pack v3.1' enabled — recently updated,</text>
        <text x="40" y="63" fill="#cfd8e8" font-size="11.5">flagged in crashlogs at the same frame.</text>
        <rect x="40" y="72" width="120" height="18" rx="9" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity="0.1"/><text x="100" y="85" text-anchor="middle" fill="#9aa6c4" font-size="10">HD Texture Pack v3.1</text>
      </g>

      <!-- Def fix -->
      <g transform="translate(0,184)">
        <rect x="0" y="6" width="26" height="26" rx="8" fill="#e0964a"/><text x="13" y="24" text-anchor="middle" fill="#06121a" font-size="11" font-weight="800">D</text>
        <text x="40" y="14" fill="#e0964a" font-size="9.5" letter-spacing="1" font-weight="700">DEFWRENCH</text>
        <text x="40" y="30" fill="#eaf2ff" font-size="13" font-weight="700">Matching Jira ticket</text>
        <text x="40" y="47" fill="#cfd8e8" font-size="11.5">GAME-1423 'Boss intro cutscene asset removed in</text>
        <text x="40" y="63" fill="#cfd8e8" font-size="11.5">1.4.2' is open and assigned — matches the crashlog.</text>
        <rect x="40" y="72" width="78" height="18" rx="9" fill="rgba(255,255,255,.05)" stroke="#fff" stroke-opacity="0.1"/><text x="79" y="85" text-anchor="middle" fill="#9aa6c4" font-size="10">GAME-1423</text>
      </g>
    </g>
  </g>
</svg>
